name: Build ESP32-S3 Firmware

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Run PlatformIO Build
        run: pio run
      - name: Create Merged Binary
        run: |
          python -m pip install esptool
          python -m esptool --chip esp32s3 merge_bin -o .pio/build/esp32s3_n16r8/firmware_merged.bin --flash_mode dio --flash_size 16MB 0x0000 .pio/build/esp32s3_n16r8/bootloader.bin 0x8000 .pio/build/esp32s3_n16r8/partitions.bin 0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin 0x10000 .pio/build/esp32s3_n16r8/firmware.bin
      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3
          path: .pio/build/esp32s3_n16r8/firmware_merged.bin
